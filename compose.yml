services:
  # dbs:
  #   image: mcr.microsoft.com/mssql/server:2022-latest
  #   container_name: cobranca-db
  #   ports: [1433:1433]
  #   environment:
  #     - ACCEPT_EULA=Y
  #     - MSSQL_SA_PASSWORD=YourStrong!Passw0rd

  api:
    build: ./backend
    # depends_on: [dbs]
    container_name: cobranca-api
    ports: [5000:80]
    environment:
      - ASPNETCORE_URLS=http://+:80
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=dbs;Database=CobrancaDB;User=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=true

  app:
    build: ./frontend
    container_name: cobranca-app
    depends_on: [api]
    ports: [4200:80]
    restart: always
    volumes: [./frontend/nginx.conf:/etc/nginx/conf.d/default.conf]
