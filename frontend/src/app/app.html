<p-toolbar class="border-none border-bottom-1 surface-border border-round">
  <div class="p-toolbar-group-start flex gap-2 p-4">
    <i class=" pi pi-wallet text-2xl text-primary"></i>
    <span class="text-xl text-900">Sistema de Cobrança | <b>Paschoalotto</b></span>
  </div>
  <div class="p-toolbar-group-end gap-2">
    <p-button label="Apresentação" icon="pi pi-home" class="px-1" routerLink="/inicial" routerLinkActive="route-active"
      [routerLinkActiveOptions]="{exact: true}" />

    <p-button label="Demonstração" icon="pi pi-list" routerLink="/titulo" routerLinkActive="route-active" />
  </div>
</p-toolbar>

<main class="flex-grow-1">
  <router-outlet></router-outlet>
</main>

<footer class="py-6 text-center border-top-1 surface-border">
  <div class="text-500">© 2025 Sistema de Cobrança • Todos os direitos reservados</div>
</footer>
